# 浏览器支持 WebP 时，图片返回同名 .webp 兄弟文件（原图保留，可随时回退）
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

# ---------- HTTP：只做证书续期校验 + 全量跳 HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com www.example.com 203.0.113.10;

    # 证书续期（certbot webroot 模式）要用，必须放在 301 之前
    location /.well-known/acme-challenge/ {
        root /var/www/english-app;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# ---------- www → 裸域 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

# ---------- 主站 HTTPS ----------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root /var/www/english-app;
    index index.html;

    # 导入截图/Excel 时会走 body，默认 1m 太小
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 图片：支持 WebP 就发同名 .webp 兄弟文件，不支持回落到原图
    location ~* ^/assets/.+\.(png|jpe?g)$ {
        add_header Vary Accept always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri$webp_suffix $uri =404;
    }

    # 其余静态资源：文件名带内容哈希，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 前端（SPA）：找不到文件就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 生成有 120s deadline，反代要留出余量
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # 健康检查直接打后端，不进前端回退
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }
}
